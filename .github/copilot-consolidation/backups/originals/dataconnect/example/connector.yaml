connectorId: example
generate:
  javascriptSdk:
    - outputDir: ..\..\src\dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ..\..
      react: true
      angular: false
      clientCache: {}
    - outputDir: ../../src/dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ../..
      react: true
      angular: false
      clientCache: {}
  adminNodeSdk:
    - outputDir: ..\..\PrimeOsHub\src\dataconnect-admin-generated
      package: "@dataconnect/admin-generated"
      packageJsonDir: ..\..\PrimeOsHub
    - outputDir: ../../src/dataconnect-admin-generated
      package: "@dataconnect/admin-generated"
      packageJsonDir: ../..
