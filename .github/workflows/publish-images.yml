name: Build and Publish Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/PrimeOsHub/primeos-frontend:${{ github.sha }}
            ghcr.io/PrimeOsHub/primeos-frontend:latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/PrimeOsHub/primeos-api:${{ github.sha }}
            ghcr.io/PrimeOsHub/primeos-api:latest

      - name: Build and push agent image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/PrimeOsHub/primeos-agent:arm64-${{ github.sha }}
            ghcr.io/PrimeOsHub/primeos-agent:arm64-latest
