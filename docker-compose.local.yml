version: '3.8'

services:
  # ============================================================================
  # SUPABASE LOCAL DEVELOPMENT
  # ============================================================================
  supabase:
    image: supabase/postgres:15-alpine
    container_name: primeos-supabase-local
    restart: unless-stopped
    platform: linux/arm64      # M1 Mac native (remove if using amd64)
    
    environment:
      - POSTGRES_PASSWORD=postgres
      - JWT_SECRET=super-secret-jwt-token-for-local-dev-only
      - ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZWFodWJucmJjbGJlbHNxaWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NTk3MDAyODAsImV4cCI6MTk3NTA2MDI4MH0.sb_publishable_MnURfwn0NCO-70pR4pF4Vw_Sl4r3CLA
      - SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZWFodWJucmJjbGJlbHNxaWtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY1OTcwMDI4MCwiZXhwIjoxOTc1MDYwMjgwfQ.7wz-sXQi2K7-7TJ8-Z-3-C-7-3-7-3-7-3-7-3-7
      - SITE_URL=http://localhost:3000
      - SUPABASE_URL=http://supabase:54321
    
    ports:
      - "54321:54321"  # REST API
      - "54322:5432"   # Direct PostgreSQL connection
      - "54323:9000"   # Realtime WebSocket
    
    volumes:
      - supabase-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    
    networks:
      - primeos-local
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:54321/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # FIREBASE EMULATOR SUITE (OPTIONAL)
  # ============================================================================
  # Uncomment to enable Firebase emulator
  # firebase-emulator:
  #   image: node:26-alpine
  #   container_name: primeos-firebase-local
  #   restart: unless-stopped
  #   working_dir: /firebase
  #   platform: linux/arm64
  #   command: >
  #     sh -c "npm install -g firebase-tools &&
  #            firebase emulators:start --project primeos-local"
  #   ports:
  #     - "4000:4000"   # Firestore Emulator UI
  #     - "5001:5001"   # Auth Emulator
  #     - "9099:9099"   # Hub
  #   networks:
  #     - primeos-local
  #   depends_on:
  #     - primeos

  # ============================================================================
  # PRIMEOS FRONTEND - PRODUCTION BUILD (NGINX)
  # ============================================================================
  primeos:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - primeos:latest
    image: primeos:local
    container_name: primeos-app-local
    restart: unless-stopped
    platform: linux/arm64      # M1 Mac native (remove if using amd64)
    
    environment:
      - NODE_ENV=production
      - VITE_LOCAL_MODE=true
      - VITE_SUPABASE_URL=http://supabase:54321
      - VITE_SUPABASE_PROJECT_ID=primeos-local
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZWFodWJucmJjbGJlbHNxaWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NTk3MDAyODAsImV4cCI6MTk3NTA2MDI4MH0.sb_publishable_MnURfwn0NCO-70pR4pF4Vw_Sl4r3CLA
      - VITE_FIREBASE_PROJECT_ID=primeos-local
      - VITE_APP_BASE_URL=http://localhost:3000
    
    ports:
      - "3000:80"     # Frontend HTTP
    
    volumes:
      - primeos-data:/app/data
      # Uncomment for live reload (requires Dockerfile changes)
      # - ./src:/usr/share/nginx/html/src
      # - ./public:/usr/share/nginx/html/public
    
    networks:
      - primeos-local
    
    depends_on:
      supabase:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Resource limits (prevents runaway memory usage)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # ============================================================================
  # PRIMEOS DEV SERVER (OPTIONAL - FOR HOT RELOAD)
  # ============================================================================
  # Uncomment to run Vite dev server instead of production build
  # primeos-dev:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   image: primeos:dev
  #   container_name: primeos-dev-local
  #   restart: unless-stopped
  #   platform: linux/arm64
  #   environment:
  #     - NODE_ENV=development
  #     - VITE_LOCAL_MODE=true
  #     - VITE_SUPABASE_URL=http://supabase:54321
  #   ports:
  #     - "5173:5173"    # Vite dev server
  #     - "24678:24678"  # HMR WebSocket
  #   volumes:
  #     - ./src:/app/src
  #     - ./public:/app/public
  #     - /app/node_modules
  #   networks:
  #     - primeos-local
  #   depends_on:
  #     supabase:
  #       condition: service_healthy

  # ============================================================================
  # PGADMIN - DATABASE BROWSER
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: primeos-pgadmin-local
    restart: unless-stopped
    platform: linux/arm64
    
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@primeos.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    
    ports:
      - "5050:80"
    
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    
    networks:
      - primeos-local
    
    depends_on:
      - supabase
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # REDIS CACHE (OPTIONAL)
  # ============================================================================
  # Uncomment to enable caching layer
  # redis:
  #   image: redis:7-alpine
  #   container_name: primeos-redis-local
  #   restart: unless-stopped
  #   platform: linux/arm64
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - primeos-local
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  primeos-local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  primeos-data:
    driver: local
  supabase-data:
    driver: local
  pgadmin-data:
    driver: local
  # redis-data:
  #   driver: local

# ============================================================================
# DOCKER COMPOSE COMMANDS
# ============================================================================
#
# Start services:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml up --build  # Rebuild images
#
# View logs:
#   docker compose -f docker-compose.local.yml logs
#   docker compose -f docker-compose.local.yml logs -f primeos
#
# Stop services:
#   docker compose -f docker-compose.local.yml down
#   docker compose -f docker-compose.local.yml down -v  # Also remove volumes
#
# Execute commands:
#   docker compose -f docker-compose.local.yml exec primeos curl http://localhost/health
#   docker compose -f docker-compose.local.yml exec supabase psql -U postgres
#
# ============================================================================
