version: '3.8'

services:
  # ============================================================================
  # PRIMEOS FRONTEND
  # ============================================================================
  primeos:
    build:
      context: .
      dockerfile: Dockerfile
    image: primeos:local
    container_name: primeos-app-local
    restart: unless-stopped
    
    ports:
      - "3000:80"
    
    volumes:
      - primeos-data:/app/data
    
    networks:
      - primeos-local
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # ============================================================================
  # PGADMIN - DATABASE BROWSER (optional)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: primeos-pgadmin-local
    restart: unless-stopped
    
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@primeos.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    
    ports:
      - "5050:80"
    
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    
    networks:
      - primeos-local
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  primeos-local:
    driver: bridge

volumes:
  primeos-data:
  pgadmin-data:
