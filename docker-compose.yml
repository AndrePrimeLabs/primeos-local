version: '3.8'
services:
  primeos:
    build:
      context: .
      dockerfile: Dockerfile
    image: primeos:latest
    container_name: primeos-app
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    networks:
      - primeos-net
    volumes:
      - primeos-data:/app/data
    # Healthcheck for VPS monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Palit Pandora integration (optional - uncomment to enable)
  # pandora-sync:
  #   image: pandora-client:latest
  #   container_name: pandora-sync
  #   restart: unless-stopped
  #   depends_on:
  #     - primeos
  #   env_file:
  #     - .env.pandora
  #   networks:
  #     - primeos-net
  #   volumes:
  #     - pandora-data:/app/data

  # Traefik reverse proxy (optional - for HTTPS at scale)
  # traefik:
  #   image: traefik:v3
  #   container_name: traefik
  #   restart: unless-stopped
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - primeos-net

networks:
  primeos-net:
    driver: bridge

volumes:
  primeos-data:
  pandora-data:
